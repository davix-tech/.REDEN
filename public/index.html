<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>REDEN API</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  />

</head>

<body>

  <div class="background-grid"></div>

  <div class="hero">

    <img
      src="/logo.png"
      alt="REDEN API"
      class="logo"
    />

    <div class="status">
      <span class="dot"></span>
      OPERATIONAL
    </div>

    <h1>
      REDEN API
    </h1>

    <p class="subtitle">
      Adaptive Decision Infrastructure
    </p>

    <div class="terminal">

      <div class="terminal-header">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <pre>
POST /score

{
  "session_id": "user_1029",
  "cart_value": 120,
  "decision": "INCENTIVE_HIGH",
  "expected_conversion": 0.81
}
      </pre>

    </div>

    <div class="buttons">

      <a
        href="/sdk.js"
        class="btn primary"
      >
        Download SDK
      </a>

      <a
        href="/metrics"
        class="btn"
      >
        Metrics
      </a>

    </div>

  </div>

</html>
